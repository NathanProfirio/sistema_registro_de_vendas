<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Sistema de Vendas
        {% endblock %}
    </title>
    <link rel="icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

    <div class="app">

        <header class="topbar">

            <a href="/" class="marca">
                <span class="marca-marca">TESTE</span>
                <span class="marca-texto">
                    <strong>Sistema de Vendas</strong>
                    <small>Registro e análise</small>
                </span>
            </a>

            <nav class="menu">
                <a
                    href="/"
                    class="menu-link {% if request.url.path == '/' %}ativo{% endif %}"
                >
                    Registrar
                </a>
                <a
                    href="/dashboard"
                    class="menu-link {% if request.url.path == '/dashboard' %}ativo{% endif %}"
                >
                    Dashboard
                </a>
            </nav>

        </header>

        <main class="container">

            {% block content %}
            {% endblock %}

        </main>

    </div>


    <!-- Chart.js -->

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js"
    ></script>


    {% block scripts %}
    {% endblock %}

</body>

</html>
